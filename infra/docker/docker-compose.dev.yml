# Local dev dependencies only (Postgres + Redis) — the apps themselves run
# via `pnpm dev` on the host for fast iteration. Run from the repo root:
#   docker compose -f infra/docker/docker-compose.dev.yml up -d
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: notifyafrica
      POSTGRES_PASSWORD: notifyafrica
      POSTGRES_DB: notifyafrica
    ports:
      - "5432:5432"
    volumes:
      - notifyafrica_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - notifyafrica_redis_data:/data

volumes:
  notifyafrica_postgres_data:
  notifyafrica_redis_data:
