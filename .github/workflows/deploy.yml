name: Build and deploy

# Push to main -> build every app's Docker image, publish to GHCR, then SSH
# into the VPS and swap the running containers over to the new images.
# See docs/DEPLOYMENT.md for the one-time VPS setup this depends on.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: wenotifyafrica

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [website, console, admin, core-api, worker]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/notifyafrica-${{ matrix.app }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/notifyafrica-${{ matrix.app }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Copy compose + proxy config to the VPS
        run: |
          ssh -o StrictHostKeyChecking=accept-new -p "${{ secrets.VPS_SSH_PORT || 22 }}" \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "mkdir -p /opt/notifyafrica"
          scp -o StrictHostKeyChecking=accept-new -P "${{ secrets.VPS_SSH_PORT || 22 }}" \
            infra/docker/docker-compose.prod.yml \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/notifyafrica/docker-compose.prod.yml"
          scp -o StrictHostKeyChecking=accept-new -P "${{ secrets.VPS_SSH_PORT || 22 }}" \
            infra/proxy/Caddyfile \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/notifyafrica/Caddyfile"

      - name: Pull new images and restart
        run: |
          ssh -o StrictHostKeyChecking=accept-new -p "${{ secrets.VPS_SSH_PORT || 22 }}" \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" '
            set -e
            cd /opt/notifyafrica
            docker compose -f docker-compose.prod.yml --env-file .env pull
            docker compose -f docker-compose.prod.yml --env-file .env up -d --remove-orphans
            docker image prune -f
          '
